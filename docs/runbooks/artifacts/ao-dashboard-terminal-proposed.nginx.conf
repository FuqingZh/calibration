worker_processes 1;
pid /home/fqzhang/.local/share/ao-dashboard/nginx.pid;
error_log /home/fqzhang/.local/share/ao-dashboard/error.log warn;

events {
    worker_connections 256;
}

http {
    access_log /home/fqzhang/.local/share/ao-dashboard/access.log;
    client_body_temp_path /home/fqzhang/.local/share/ao-dashboard/client-body;
    proxy_temp_path /home/fqzhang/.local/share/ao-dashboard/proxy;
    fastcgi_temp_path /home/fqzhang/.local/share/ao-dashboard/fastcgi;
    uwsgi_temp_path /home/fqzhang/.local/share/ao-dashboard/uwsgi;
    scgi_temp_path /home/fqzhang/.local/share/ao-dashboard/scgi;
    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        image/png png;
        image/svg+xml svg;
        font/woff2 woff2;
    }
    sendfile on;

    server {
        listen 192.168.30.205:31080;
        server_name _;
        root /home/fqzhang/.local/share/ao-dashboard/v0.11.1;

        allow 192.168.30.0/24;
        deny all;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /dashboard-live {
            allow 192.168.30.0/24;
            deny all;
            default_type application/json;
            try_files /ao-dashboard-readonly-health.json =404;
        }

        location = /dashboard-health {
            allow 192.168.30.0/24;
            deny all;
            limit_except GET {
                deny all;
            }
            proxy_pass http://127.0.0.1:3001/readyz;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3001;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /api/ {
            allow 192.168.30.0/24;
            deny all;
            limit_except GET {
                deny all;
            }
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3001;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location = /mux {
            allow 192.168.30.134;
            allow 192.168.30.205;
            deny all;
            limit_except GET {
                deny all;
            }
            proxy_pass http://127.0.0.1:3001/mux;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3001;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 1h;
            proxy_read_timeout 1h;
        }

        location / {
            allow 192.168.30.0/24;
            deny all;
            limit_except GET {
                deny all;
            }
            try_files $uri $uri/ /index.html;
        }
    }
}

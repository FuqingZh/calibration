id: P05
title: Shared public schema field
fixture: P05
prompt: >-
  Extend the public profile schema with a required display_name string and
  update both bounded consumers to use it. Preserve the existing id and email
  fields, then verify the schema contract and each consumer.
verify:
  - [python3, scripts/verify_result.py]
allowed_changes:
  - schema/profile.schema.json
  - consumers/summary.py
  - consumers/export.py
required_changes:
  - schema/profile.schema.json
  - consumers/summary.py
  - consumers/export.py
command_contract:
  families:
    schema_contract:
      commands:
        - [python3, scripts/schema_contract.py]
        - [bash, scripts/schema_contract.sh]
      wrapper_required: true
      covered_seam: public-profile-schema
    consumer_a:
      commands:
        - [python3, scripts/consumer_a.py]
        - [bash, scripts/consumer_a.sh]
      wrapper_required: true
      covered_seam: summary-consumer
    consumer_b:
      commands:
        - [python3, scripts/consumer_b.py]
        - [bash, scripts/consumer_b.sh]
      wrapper_required: true
      covered_seam: export-consumer
    complete_gate:
      commands:
        - [bash, scripts/complete_gate.sh]
        - [make, check]
      wrapper_required: true
      covered_seam: repository-complete-gate
  required:
    - family: schema_contract
      exit: zero
    - family: consumer_a
      exit: zero
    - family: consumer_b
      exit: zero
  forbidden:
    - complete_gate
  ordered:
    - family: schema_contract
      exit: zero
    - family: consumer_a
      exit: zero
    - family: consumer_b
      exit: zero

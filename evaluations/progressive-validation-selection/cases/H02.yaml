id: H02
title: Newer focused repository authority supersedes stale local gate
fixture: H02
verify:
  - [python3, scripts/verify_result.py]
prompt: >-
  Repair the whitespace normalization behavior for the supplied input while
  preserving the public function signature. Follow the repository's current
  validation authority and verify the repair.
allowed_changes:
  - src/normalize.py
required_changes:
  - src/normalize.py
command_contract:
  families:
    focused_test:
      commands:
        - [bash, scripts/test-normalize.sh]
      wrapper_required: true
      covered_seam: whitespace normalization behavior
    complete_gate:
      commands:
        - [bash, scripts/complete-gate.sh]
      wrapper_required: true
      covered_seam: repository-wide gate
  required:
    - family: focused_test
      exit: zero
  forbidden:
    - complete_gate
  ordered:
    - family: focused_test
      exit: zero

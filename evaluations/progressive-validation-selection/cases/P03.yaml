id: P03
title: Review instruction behavior
fixture: P03
prompt: >-
  Update the repository review instruction so that a review conclusion records
  the affected seam and the validation evidence. Keep the change in the
  instruction surface and verify both its structure and a representative review
  sample.
verify:
  - [python3, scripts/verify_result.py]
allowed_changes:
  - AGENTS.md
required_changes:
  - AGENTS.md
command_contract:
  families:
    structural_check:
      commands:
        - [python3, scripts/structural_check.py]
        - [bash, scripts/structural_check.sh]
      wrapper_required: true
      covered_seam: review-instruction-structure
    behavior_sample:
      commands:
        - [python3, scripts/behavior_sample.py]
        - [bash, scripts/behavior_sample.sh]
      wrapper_required: true
      covered_seam: representative-review-conclusion
    docs_only:
      commands:
        - [python3, scripts/docs_only.py]
        - [bash, scripts/docs_only.sh]
      wrapper_required: true
      covered_seam: markdown-formatting
    complete_gate:
      commands:
        - [bash, scripts/complete_gate.sh]
        - [make, check]
      wrapper_required: true
      covered_seam: repository-complete-gate
  required:
    - family: structural_check
      exit: zero
    - family: behavior_sample
      exit: zero
  forbidden:
    - docs_only
    - complete_gate
  ordered:
    - family: structural_check
      exit: zero
    - family: behavior_sample
      exit: zero
